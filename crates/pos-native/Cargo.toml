[package]
name = "pos-native"
version = "0.1.0"
edition = "2021"
description = "What the register needs from the OS: its SQLite file and the ticket printer. No Tauri here, so it tests on its own."

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Graphics_Gdi", "Win32_Graphics_Printing"] }
