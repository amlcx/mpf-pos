# Pushing a tag vX.Y.Z builds a release. Nothing reaches the server or any
# register here: deploy.yml and promote.yml are separate manual steps.
name: release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.v.outputs.value }}
    steps:
      - id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag $tag is not vX.Y.Z" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

  api-image:
    needs: [checks, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: node scripts/set-version.mjs "${{ needs.version.outputs.value }}"

      # The production server is arm64; amd64 keeps the image usable anywhere.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The same Dockerfile Dokploy builds (docs/DEPLOY.md). APP_VERSION ends
      # up in /health, which deploy.yml polls.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.version.outputs.value }}
          tags: ghcr.io/amlcx/mpf-pos-api:${{ needs.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  installer:
    needs: [checks, version]
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write # create the GitHub Release and upload its assets
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - run: node scripts/set-version.mjs "${{ needs.version.outputs.value }}"

      - run: pnpm install --frozen-lockfile

      # Builds the NSIS installer, signs the updater bundle with our minisign
      # key and attaches both, plus latest.json, to the release for this tag.
      # Runs the "tauri" script of apps/desktop/package.json.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: Mi Postre Favorito ${{ github.ref_name }}
          releaseBody: Use deploy.yml, then promote.yml, to roll this out.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
